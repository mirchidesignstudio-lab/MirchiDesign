<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mirchi Marketing Studio data assets launch countdown.">
  <title>Our Data Assets | Mirchi Marketing Studio</title>
  <style>
    :root {
      --red: #ec1b24;
      --ink: #1b1011;
      --paper: #fffdfb;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }

    .launch-page {
      position: relative;
      display: grid;
      min-height: 100svh;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      isolation: isolate;
    }

    .launch-page::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: url("assets/data-assets-launch-background.png") center / cover no-repeat;
    }

    .launch-page::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(255, 253, 251, .97) 0%, rgba(255, 253, 251, .78) 33%, rgba(255, 253, 251, .1) 72%, rgba(255, 253, 251, .03) 100%);
      pointer-events: none;
    }

    .site-header,
    .launch-content,
    .launch-footer {
      width: min(100% - 48px, 1360px);
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 28px 0 0;
    }

    .home-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      text-decoration: none;
      transition: transform .2s ease;
    }

    .home-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .home-logo:hover,
    .home-logo:focus-visible {
      transform: rotate(-5deg) scale(1.05);
      outline: none;
    }

    .home-logo:focus-visible {
      outline: 3px solid rgba(236, 27, 36, .36);
      outline-offset: 4px;
      border-radius: 50%;
    }

    .studio-mark {
      color: var(--red);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border-bottom: 2px solid var(--red);
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color .2s ease, transform .2s ease;
    }

    .home-link:hover,
    .home-link:focus-visible {
      color: var(--red);
      transform: translateX(-3px);
      outline: none;
    }

    .launch-content {
      display: grid;
      align-content: center;
      justify-items: start;
      padding: 78px 0;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(54px, 9vw, 150px);
      font-weight: 900;
      line-height: .82;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      color: var(--red);
      -webkit-text-stroke: 1px var(--red);
      text-shadow: 5px 5px 0 rgba(236, 27, 36, .16);
    }

    .launch-copy {
      max-width: 460px;
      margin: 28px 0 0;
      font-size: clamp(15px, 1.5vw, 19px);
      font-weight: 700;
      line-height: 1.45;
    }

    .countdown {
      display: grid;
      width: min(100%, 640px);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 38px;
    }

    .countdown-unit {
      min-width: 0;
      padding: 12px 8px 10px;
      border-top: 4px solid var(--red);
      background: rgba(255, 253, 251, .82);
      box-shadow: 0 8px 0 rgba(236, 27, 36, .12);
    }

    .countdown-value {
      display: block;
      color: var(--red);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(45px, 7vw, 92px);
      font-weight: 900;
      line-height: .82;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }

    .countdown-label {
      display: block;
      margin-top: 12px;
      color: var(--ink);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .launch-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 0 0 26px;
      color: #5a3b3d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .launch-date { color: var(--red); }

    @media (max-width: 700px) {
      .launch-page::after {
        background: linear-gradient(180deg, rgba(255, 253, 251, .94) 0%, rgba(255, 253, 251, .8) 52%, rgba(255, 253, 251, .28) 100%);
      }

      .site-header,
      .launch-content,
      .launch-footer {
        width: min(100% - 32px, 560px);
      }

      .site-header { padding-top: 18px; }

      .launch-content { align-content: start; padding: 72px 0 36px; }

      h1 { font-size: clamp(52px, 17vw, 90px); }

      .launch-copy { margin-top: 22px; }

      .countdown { gap: 5px; margin-top: 30px; }

      .countdown-unit { padding: 10px 6px 8px; }

      .countdown-label { margin-top: 9px; font-size: 8px; letter-spacing: .08em; }

      .launch-footer { align-items: flex-start; flex-direction: column; padding-bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="launch-page">
    <header class="site-header">
      <a class="home-logo" href="index.html" aria-label="Back to Mirchi Marketing Studio home" title="Home">
        <img src="assets/mirchi-round-logo.png" alt="">
      </a>
      <span class="studio-mark">Data Assets</span>
      <a class="home-link" href="index.html">Home</a>
    </header>

    <section class="launch-content" aria-labelledby="launch-title">
      <p class="eyebrow">Incoming signal</p>
      <h1 id="launch-title">The data<br><span>makes DeSHINES.</span></h1>
      <p class="launch-copy">A free library of data based design assets for our clients- Sharper decisions, Clearer marketing, and Better outcomes.</p>
      <div class="countdown" aria-label="Countdown to launch" aria-live="polite">
        <div class="countdown-unit"><time class="countdown-value" id="days">05</time><span class="countdown-label">Days</span></div>
        <div class="countdown-unit"><time class="countdown-value" id="hours">00</time><span class="countdown-label">Hours</span></div>
        <div class="countdown-unit"><time class="countdown-value" id="minutes">00</time><span class="countdown-label">Minutes</span></div>
        <div class="countdown-unit"><time class="countdown-value" id="seconds">00</time><span class="countdown-label">Seconds</span></div>
      </div>
    </section>

    <footer class="launch-footer">
      <span>Our Data Assets</span>
      <span class="launch-date">See you soon</span>
    </footer>
  </main>
  <script>
    const launchAt = new Date("2026-10-15T23:59:59+05:30").getTime();
    const parts = {
      days: document.querySelector("#days"),
      hours: document.querySelector("#hours"),
      minutes: document.querySelector("#minutes"),
      seconds: document.querySelector("#seconds")
    };

    const renderCountdown = () => {
      const remaining = Math.max(0, launchAt - Date.now());
      const days = Math.floor(remaining / 86400000);
      const hours = Math.floor((remaining % 86400000) / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      const values = { days, hours, minutes, seconds };
      Object.entries(values).forEach(([name, value]) => {
        parts[name].textContent = String(value).padStart(2, "0");
      });
      if (remaining === 0) document.querySelector(".eyebrow").textContent = "Now live";
    };

    renderCountdown();
    window.setInterval(renderCountdown, 1000);
  </script>
</body>
</html>
